# This becomes the Reply-To header, so it must be the inbox the bot polls for
# replies (IMAP_USER, or the Gmail API account) -- point it anywhere else and
# replies never reach the bot, which keeps nudging people who already answered.
reply_to: you@example.org
phone: "+91 00000 00000"
website: https://www.hackatdotslash.co.in

# What is genuinely new about this edition. ONLY the returning-sponsor email
# uses it: a company that already backed DotSlash does not need the pitch, it
# needs a reason to come back, and "we are running it again" is a weak one.
# Leave it blank and the drafter is told to lean on the edition number rather
# than invent a change -- an invented one is worse than none.
#   e.g. "A hardware track with ASHINE's lab, and the prize pool has doubled."
whats_new: ""

