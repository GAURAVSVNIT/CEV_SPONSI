event_name: DotSlash 10.0
date: 20-21 February 2027
summary: >-
  The 10th edition of ACM SVNIT's flagship 36-hour national-level hackathon,
  organised annually with ASHINE Research Park, SVNIT Surat. One of Gujarat's
  largest hackathons.
colleges: >-
  Student innovators from across India; DotSlash 9.0 drew applications from
  600+ colleges across 25+ states.

