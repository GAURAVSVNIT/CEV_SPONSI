region: Gujarat
country: India
kind: hackathon                  # hackathon | tech fest | case competition | conference

currency: USD

# Verified facts about past editions. The drafter may cite these and nothing
# else about us.
track_record:
  - 9 successful editions completed before DotSlash 10.0
  - DotSlash 9.0 recorded 1,750+ applications from 600+ colleges across 25+ states
  - DotSlash 9.0 achieved 50K+ social media engagements and 100K+ website impressions
  - DotSlash 9.0 delivered real-world, high-impact problem statements through 24+ hours of continuous innovation and rapid prototyping
  - DotSlash has served as a launchpad for future founders, engineers and researchers
  - Run with ASHINE Research Park, SVNIT Surat
  - ACM NIT Surat, the student chapter behind DotSlash, was founded in 2005
  - DotSlash 10.0 runs for 36 hours

