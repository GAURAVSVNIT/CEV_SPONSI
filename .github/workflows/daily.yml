name: daily

# 10:00 IST = 04:30 UTC. GitHub's scheduler is best-effort and often runs late;
# the job is idempotent (one successful run per calendar day) so a late or
# double fire is harmless.
#
# What this runner can and cannot do: it researches, drafts and posts cards to
# Telegram. It cannot send mail -- no SMTP password, no Gmail token, and
# ALLOW_SEND=0 -- so the worst thing a bad run can do here is a bad draft. You
# tap [Send] from `python run.py serve` on your own machine, where the Gmail
# credential lives.
on:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "max prospects to work this run (a free Gemini key manages about 3)"
        default: "5"
      force:
        description: "run even if it already ran today"
        type: boolean
        default: false

concurrency:
  group: sponsy-daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # The secrets context cannot be read in a step's `if:`, so the two
      # optional files come in through job-level env and the steps test that.
      SPONSY_EVENT_B64: ${{ secrets.SPONSY_EVENT_B64 }}
      SPONSY_VOICE_B64: ${{ secrets.SPONSY_VOICE_B64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # The ladder spans weeks, so state has to survive between runs. Cache is
      # the cheapest durable-enough store for a single-user tool. It is
      # best-effort: if an entry is evicted, prospects with a next_touch in the
      # past are picked up again on the next run, but touch counts reset.
      - name: restore state
        uses: actions/cache/restore@v4
        with:
          path: data/sponsy.db
          key: sponsy-db-${{ github.run_id }}
          restore-keys: sponsy-db-

      # event.yml and voice.yml are gitignored (a phone number, your own
      # emails). Store each as one base64 secret:
      #   base64 -w0 data/event.yml   -> SPONSY_EVENT_B64
      #   base64 -w0 data/voice.yml   -> SPONSY_VOICE_B64
      # Without them the run uses data/event.example.yml and a plain voice.
      - name: write event.yml
        if: env.SPONSY_EVENT_B64 != ''
        run: echo "$SPONSY_EVENT_B64" | base64 -d > data/event.yml

      - name: write voice.yml
        if: env.SPONSY_VOICE_B64 != ''
        run: echo "$SPONSY_VOICE_B64" | base64 -d > data/voice.yml

      - name: run the agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          # Read-only reply polling. With the Gmail API there is no token here,
          # so IMAP with an app password is the only way CI can read replies.
          IMAP_HOST: ${{ secrets.IMAP_HOST }}
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASSWORD: ${{ secrets.IMAP_PASSWORD }}
          # Deliberately absent: SMTP_USER / SMTP_PASSWORD and the Gmail OAuth
          # token. CI can only draft. Even if a [Send] verdict is drained here,
          # delivery resolves to manual: an .eml in the artifact, nothing
          # leaves. Keep `serve` running on your machine so it is the one that
          # picks up your taps.
          ALLOW_SEND: "0"
        run: |
          python run.py import data/prospects.csv
          python run.py run \
            --limit ${{ github.event.inputs.limit || '5' }} \
            ${{ github.event.inputs.force == 'true' && '--force' || '' }}

      - name: save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/sponsy.db
          key: sponsy-db-${{ github.run_id }}

      - name: keep a copy of the audit log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sponsy-db-${{ github.run_id }}
          path: |
            data/sponsy.db
            data/outbox/notifications.log
          retention-days: 30
          if-no-files-found: warn
